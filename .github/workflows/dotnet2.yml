name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Отримання коду
      uses: actions/checkout@v4

    - name: Встановлення .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Відновлення залежностей
      run: dotnet restore "oop laba1.sln"

    - name: Збірка проєкту (Build)
      run: dotnet build "oop laba1.sln" --no-restore

    - name: Запуск тестів (Test)
      run: dotnet test "oop laba1.sln" --no-build --verbosity normal
